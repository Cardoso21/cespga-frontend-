<p-toast />
<p-confirmDialog />

<div class="page-container">
  <div class="page-header">
    <h1>Usuários</h1>
    <p-button label="Novo usuário" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-card>
    <p-table [value]="users" [loading]="loading" styleClass="p-datatable-striped p-datatable-gridlines">
      <ng-template pTemplate="header">
        <tr>
          <th>Nome</th>
          <th>Usuário</th>
          <th>Perfil</th>
          <th>Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-u>
        <tr [class.inactive-row]="!u.enabled">
          <td>{{ u.fullName }}</td>
          <td>{{ u.username }}</td>
          <td class="tags-cell">
            @if (isAdmin(u)) {
              <p-tag value="Admin" severity="warn" icon="pi pi-shield" />
            } @else {
              <p-tag value="Comum" severity="secondary" />
            }
            @if (!u.enabled) {
              <p-tag value="Inativo" severity="danger" />
            }
          </td>
          <td class="actions-cell">
            <p-button
              [icon]="isAdmin(u) ? 'pi pi-times' : 'pi pi-shield'"
              [severity]="isAdmin(u) ? 'danger' : 'success'"
              [outlined]="true"
              size="small"
              [disabled]="!u.enabled"
              [pTooltip]="isAdmin(u) ? 'Remover Admin' : 'Tornar Admin'"
              tooltipPosition="top"
              (onClick)="toggleAdmin(u)"
            />
            <p-button
              [icon]="u.enabled ? 'pi pi-ban' : 'pi pi-check-circle'"
              [severity]="u.enabled ? 'secondary' : 'success'"
              [outlined]="true"
              size="small"
              [pTooltip]="u.enabled ? 'Inativar' : 'Reativar'"
              tooltipPosition="top"
              (onClick)="toggleEnabled(u)"
            />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="empty-msg">Nenhum usuário encontrado.</td>
        </tr>
      </ng-template>
    </p-table>

    @if (totalElements > pageSize) {
      <p-paginator
        [first]="page * pageSize"
        [rows]="pageSize"
        [totalRecords]="totalElements"
        (onPageChange)="onPageChange($event)"
        styleClass="mt-3"
      />
    }
  </p-card>
</div>

<p-dialog
  [(visible)]="showModal"
  header="Novo Usuário"
  [modal]="true"
  [style]="{ width: '640px' }"
  [draggable]="false"
>
  @if (error) {
    <p-message severity="error" [text]="error" styleClass="w-full mb-3" />
  }

  <div class="field">
    <label>Selecionar médium cadastrado</label>
    <p-select
      [(ngModel)]="selectedMedium"
      [options]="mediunOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Escolha um médium (opcional)"
      [filter]="true"
      filterPlaceholder="Buscar..."
      styleClass="w-full"
      (onChange)="onMediumSelect($event.value)"
    />
  </div>

  <hr class="divider" />

  <div class="field">
    <label>Nome completo *</label>
    <input pInputText [(ngModel)]="form.fullName" class="w-full" placeholder="Preenchido ao selecionar médium" />
  </div>
  <div class="field">
    <label>E-mail (login) *</label>
    <input pInputText [(ngModel)]="form.username" class="w-full" type="email" placeholder="Ex: joao.silva@email.com" />
  </div>
  <div class="field">
    <label>Senha *</label>
    <p-password [(ngModel)]="form.password" [feedback]="true" [toggleMask]="true"
                styleClass="w-full" inputStyleClass="w-full" placeholder="Mínimo 6 caracteres" />
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="showModal = false" />
    <p-button label="Criar" icon="pi pi-check" [loading]="saving" (onClick)="save()" />
  </ng-template>
</p-dialog>
