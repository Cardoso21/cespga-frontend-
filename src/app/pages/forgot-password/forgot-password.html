<div class="login-page">
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <h1>CESPGA</h1>
      <p>Recuperar senha</p>
    </div>

    <div class="alert alert-success" *ngIf="success">{{ success }}</div>
    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="submit()" *ngIf="!success">
      <p class="info-text">Informe seu e-mail cadastrado para receber o link de redefinição de senha.</p>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="seu@email.com" required />
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Enviar link' }}
      </button>
    </form>

    <div class="forgot-link">
      <a routerLink="/login">Voltar ao login</a>
    </div>
  </div>
</div>
