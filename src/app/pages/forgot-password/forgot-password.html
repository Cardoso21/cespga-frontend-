<div class="login-page">
  <p-card class="login-card">
    <ng-template pTemplate="header">
      <div class="logo">
        <img src="logo.png" alt="CESPGA" class="logo-img" />
        <p>Recuperar senha</p>
      </div>
    </ng-template>

    @if (success) {
      <p-message severity="success" [text]="success" styleClass="w-full mb-3" />
    }
    @if (error) {
      <p-message severity="error" [text]="error" styleClass="w-full mb-3" />
    }

    @if (!success) {
      <form (ngSubmit)="submit()">
        <p class="info-text">Informe seu e-mail cadastrado para receber o link de redefinição de senha.</p>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" pInputText [(ngModel)]="email" name="email"
                 placeholder="seu@email.com" class="w-full" required />
        </div>

        <p-button type="submit" [label]="loading ? 'Enviando...' : 'Enviar link'"
                  styleClass="w-full mt-2" [loading]="loading" />
      </form>
    }

    <div class="forgot-link mt-3">
      <a routerLink="/login">Voltar ao login</a>
    </div>
  </p-card>
</div>
