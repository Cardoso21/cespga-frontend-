<div class="page-container">
  <div class="page-header">
    <h1>Agenda</h1>
    <button class="btn btn-primary" (click)="openCreate()">
      <i class="pi pi-plus"></i> Novo evento
    </button>
  </div>

  <div *ngIf="loading" class="loading-msg">Carregando...</div>

  <div class="events-grid" *ngIf="!loading">
    <div class="card event-card" *ngFor="let e of eventos">
      <div class="event-date">
        <span class="day">{{ e.dataEvento | slice:8:10 }}</span>
        <span class="month">{{ monthName(e.dataEvento) }}</span>
      </div>
      <div class="event-info">
        <div class="event-name">{{ e.nome }}</div>
        <div class="event-desc" *ngIf="e.descricao">{{ e.descricao }}</div>
        <div class="event-status" *ngIf="e.situacao">
          <span class="badge badge-purple">{{ e.situacao.descricao }}</span>
        </div>
      </div>
      <div class="event-actions">
        <a [routerLink]="['/agenda', e.id, 'album']" class="btn btn-outline" title="Álbum de fotos">
          <i class="pi pi-images"></i>
        </a>
        <button class="btn btn-outline" (click)="openEdit(e)" title="Editar">
          <i class="pi pi-pencil"></i>
        </button>
        <button class="btn btn-danger" (click)="confirmDelete(e.id!)" title="Excluir">
          <i class="pi pi-trash"></i>
        </button>
      </div>
    </div>

    <div class="empty-events" *ngIf="eventos.length === 0">
      <i class="pi pi-calendar"></i>
      <p>Nenhum evento cadastrado.</p>
    </div>
  </div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button (click)="goTo(page-1)" [disabled]="page === 0">&#8249;</button>
    <button *ngFor="let p of pages()" [class.active]="p === page" (click)="goTo(p)">{{ p + 1 }}</button>
    <button (click)="goTo(page+1)" [disabled]="page === totalPages - 1">&#8250;</button>
  </div>
</div>

<!-- Modal Cadastro/Edição -->
<div class="modal-overlay" *ngIf="showModal" (click)="showModal=false">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>{{ editingId ? 'Editar' : 'Novo' }} Evento</h2>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <div class="form-group">
      <label>Nome do evento *</label>
      <input [(ngModel)]="form.nome" required />
    </div>
    <div class="form-group">
      <label>Data do evento *</label>
      <input type="date" [(ngModel)]="form.dataEvento" required />
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <textarea [(ngModel)]="form.descricao" rows="3"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" (click)="showModal=false">Cancelar</button>
      <button class="btn btn-primary" (click)="save()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal Confirmação Delete -->
<div class="modal-overlay" *ngIf="showDeleteModal" (click)="showDeleteModal=false">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>Confirmar exclusão</h2>
    <p>Tem certeza que deseja excluir este evento?</p>
    <div class="modal-actions">
      <button class="btn btn-outline" (click)="showDeleteModal=false">Cancelar</button>
      <button class="btn btn-danger" (click)="doDelete()">Excluir</button>
    </div>
  </div>
</div>
