<div class="login-page">
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <h1>CESPGA</h1>
      <p>Nova senha</p>
    </div>

    <div class="alert alert-success" *ngIf="success">{{ success }}</div>
    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="submit()" *ngIf="!success">
      <div class="form-group">
        <label>Nova senha</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="Mínimo 6 caracteres" required />
      </div>
      <div class="form-group">
        <label>Confirmar senha</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repita a senha" required />
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="loading">
        {{ loading ? 'Salvando...' : 'Redefinir senha' }}
      </button>
    </form>

    <div class="forgot-link" *ngIf="success">
      <a routerLink="/login">Ir para o login</a>
    </div>
  </div>
</div>
