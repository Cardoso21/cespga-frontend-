<div class="login-page">
  <p-card class="login-card">
    <ng-template pTemplate="header">
      <div class="logo">
        <img src="logo.png" alt="CESPGA" class="logo-img" />
        <p>Nova senha</p>
      </div>
    </ng-template>

    @if (success) {
      <p-message severity="success" [text]="success" styleClass="w-full mb-3" />
    }
    @if (error) {
      <p-message severity="error" [text]="error" styleClass="w-full mb-3" />
    }

    @if (!success) {
      <form (ngSubmit)="submit()">
        <div class="field">
          <label for="newPassword">Nova senha</label>
          <p-password id="newPassword" [(ngModel)]="newPassword" name="newPassword"
                      placeholder="Mínimo 6 caracteres" [feedback]="false" [toggleMask]="true"
                      styleClass="w-full" inputStyleClass="w-full" />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirmar senha</label>
          <p-password id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword"
                      placeholder="Repita a senha" [feedback]="false" [toggleMask]="true"
                      styleClass="w-full" inputStyleClass="w-full" />
        </div>

        <p-button type="submit" [label]="loading ? 'Salvando...' : 'Redefinir senha'"
                  styleClass="w-full mt-2" [loading]="loading" />
      </form>
    }

    @if (success) {
      <div class="forgot-link mt-3">
        <a routerLink="/login">Ir para o login</a>
      </div>
    }
  </p-card>
</div>
