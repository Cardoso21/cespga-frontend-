<div class="login-page">
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <h1>CESPGA</h1>
      <p>Centro Espírita</p>
    </div>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Usuário</label>
        <input type="text" [(ngModel)]="username" name="username" placeholder="Digite seu usuário" required />
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Digite sua senha" required />
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <div class="forgot-link">
      <a routerLink="/forgot-password">Esqueci minha senha</a>
    </div>
  </div>
</div>
