<div class="login-page">
  <p-card class="login-card">
    <ng-template pTemplate="header">
      <div class="logo">
        <img src="logo.jpeg" alt="CESPGA" class="logo-img" />
        <p>Centro Espírita Pai Guine de Aruanda</p>
      </div>
    </ng-template>

    @if (error) {
      <p-message severity="error" [text]="error" styleClass="w-full mb-3" />
    }

    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="username">Usuário</label>
        <input id="username" type="text" pInputText [(ngModel)]="username" name="username"
               placeholder="Digite seu usuário" class="w-full" required />
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <p-password id="password" [(ngModel)]="password" name="password"
                    placeholder="Digite sua senha" [feedback]="false" [toggleMask]="true"
                    styleClass="w-full" inputStyleClass="w-full" />
      </div>

      <p-button type="submit" [label]="loading ? 'Entrando...' : 'Entrar'"
                styleClass="w-full mt-2" [loading]="loading" />
    </form>

    <div class="forgot-link mt-3">
      <a routerLink="/forgot-password">Esqueci minha senha</a>
    </div>
  </p-card>
</div>
