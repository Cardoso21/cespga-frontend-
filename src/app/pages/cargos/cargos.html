<p-toast />
<p-confirmDialog />

<div class="page-container">
  <div class="page-header">
    <h1>Cargos</h1>
    <p-button label="Novo cargo" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-card>
    <p-table [value]="cargos" [loading]="loading" styleClass="p-datatable-striped p-datatable-gridlines">
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 80px">#</th>
          <th>Descrição</th>
          <th style="width: 120px">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-c>
        <tr>
          <td>{{ c.id }}</td>
          <td>{{ c.descricao }}</td>
          <td class="actions-cell">
            <p-button icon="pi pi-pencil" severity="secondary" [outlined]="true" size="small" pTooltip="Editar" tooltipPosition="top" (onClick)="openEdit(c)" />
            <p-button icon="pi pi-trash" severity="danger" [outlined]="true" size="small" pTooltip="Excluir" tooltipPosition="top" (onClick)="confirmDelete(c.id!)" />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3">
            <div class="empty-state">
              <i class="pi pi-briefcase"></i>
              <p class="empty-title">Nenhum cargo cadastrado</p>
              <p class="empty-sub">Clique em "Novo cargo" para começar.</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

<p-dialog
  [(visible)]="showModal"
  [header]="editingId ? 'Editar Cargo' : 'Novo Cargo'"
  [modal]="true"
  [style]="{ width: '420px' }"
  [draggable]="false"
>
  @if (error) {
    <p-message severity="error" [text]="error" styleClass="w-full mb-3" />
  }

  <div class="field">
    <label>Descrição *</label>
    <input pInputText [(ngModel)]="form.descricao" placeholder="Ex: Zelador, Médium, Dirigente..." class="w-full" />
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="showModal = false" />
    <p-button [label]="editingId ? 'Atualizar' : 'Salvar'" icon="pi pi-check" (onClick)="save()" />
  </ng-template>
</p-dialog>
