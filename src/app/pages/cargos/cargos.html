<div class="page-container">
  <div class="page-header">
    <h1>Cargos</h1>
    <button class="btn btn-primary" (click)="openCreate()">
      <i class="pi pi-plus"></i> Novo cargo
    </button>
  </div>

  <div *ngIf="loading" class="loading-msg">Carregando...</div>

  <div class="card" *ngIf="!loading">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Descrição</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of cargos">
          <td>{{ c.id }}</td>
          <td>{{ c.descricao }}</td>
        </tr>
        <tr *ngIf="cargos.length === 0">
          <td colspan="2" class="empty">Nenhum cargo cadastrado.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Cadastro -->
<div class="modal-overlay" *ngIf="showModal" (click)="showModal=false">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>Novo Cargo</h2>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <div class="form-group">
      <label>Descrição *</label>
      <input [(ngModel)]="form.descricao" placeholder="Ex: Zelador, Médium, Dirigente..." required />
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" (click)="showModal=false">Cancelar</button>
      <button class="btn btn-primary" (click)="save()">Salvar</button>
    </div>
  </div>
</div>
